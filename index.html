<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMOJIFY: say it in emoji, see if they get it</title>
    <meta name="description" content="Type something true, get it back as an emoji riddle, and send it to friends: three tries each, an AI judges every guess, and you see who got it. Plus a daily emoji puzzle." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://emojify.co/" />

    <!-- Link previews (Facebook, Reddit, WhatsApp, X). Riddle links get their own title from functions/index.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EMOJIFY" />
    <meta property="og:url" content="https://emojify.co/" />
    <meta property="og:title" content="Say it in emoji. See if your friends get it." />
    <meta property="og:description" content="Your sentence becomes an emoji riddle. Friends get three tries, an AI judges every guess, and you see who got it." />
    <meta property="og:image" content="https://emojify.co/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A fluorescent flyer reading “I spent my whole paycheck on shoes” translated into emoji, with a whale for whole." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Say it in emoji. See if your friends get it." />
    <meta name="twitter:description" content="Your sentence becomes an emoji riddle. Friends get three tries, an AI judges every guess, and you see who got it." />
    <meta name="twitter:image" content="https://emojify.co/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />

    <!-- Light kraft board or black wall, set before first paint so the page never flashes the wrong one. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('emojify_mode');
          if (!m && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) m = 'dark';
          document.documentElement.dataset.mode = m === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
      </head>
  <body>
    <div id="root"></div>
    <noscript>EMOJIFY needs JavaScript to turn your sentences into emoji riddles.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
