# Cloudflare Pages config for EMOJIFY (project "emojify", https://emojify-efn.pages.dev).
# Deploy: npm run build && npx wrangler pages deploy dist --project-name emojify --branch main
# Schema changes: add a file to migrations/, then
#   npx wrangler d1 migrations apply emojify --remote
# Secrets are set with `npx wrangler pages secret put <NAME> --project-name emojify`, never in this file:
#   OPENROUTER_API_KEY  making riddles and judging guesses (free-model chain in functions/api/_ai.js;
#                       override with an AI_MODELS variable)
#   STRIPE_SECRET_KEY   only if Pro comes back: a Stripe restricted key with only "Checkout Sessions: Read"
# (OPENAI_API_KEY and LEMONSQUEEZY_* still work if you ever switch back.)
name = "emojify"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

# Riddles and every guess at them (functions/api/riddle/*).
[[d1_databases]]
binding = "DB"
database_name = "emojify"
database_id = "6f80a59d-3f82-4a1c-8bb2-133bcefcb9cc"

# License keys minted after Stripe checkout (functions/api/stripe/claim.js). Dormant while everything is free.
[[kv_namespaces]]
binding = "LICENSES"
id = "18cf99c2d0af460794db0cd8ea108904"
