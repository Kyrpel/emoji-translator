# Cloudflare Pages config for EMOJIFY (project "emojify", https://emojify-efn.pages.dev).
# Deploy: npm run build && npx wrangler pages deploy dist --project-name emojify --branch main
# Secrets are set with `npx wrangler pages secret put <NAME> --project-name emojify`, never in this file:
#   OPENROUTER_API_KEY  AI translate + Pro voices (free-model chain in functions/api/translate.js; override with an AI_MODELS variable)
#   STRIPE_SECRET_KEY   a Stripe restricted key with only "Checkout Sessions: Read"
# (OPENAI_API_KEY and LEMONSQUEEZY_* still work if you ever switch back.)
name = "emojify"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

# License keys minted after Stripe checkout (functions/api/stripe/claim.js).
[[kv_namespaces]]
binding = "LICENSES"
id = "18cf99c2d0af460794db0cd8ea108904"
